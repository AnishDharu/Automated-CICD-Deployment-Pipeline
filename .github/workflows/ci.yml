# ============================================================
# CI/CD Pipeline — Tasks API
# Triggers on every push to main
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USER }}/tasks-api

jobs:

  # ────────────────────────────────────────────────────────────
  # STAGE 1 — Run tests against a real Postgres container
  # ────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasks_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-fail-under=70 tests/

  # ────────────────────────────────────────────────────────────
  # STAGE 2 — Build Docker image tagged with commit SHA
  # ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test                          # only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Save image as artifact
        run: docker save $IMAGE:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ────────────────────────────────────────────────────────────
  # STAGE 3 — Scan for CRITICAL vulnerabilities with Trivy
  # ────────────────────────────────────────────────────────────
  scan:
    runs-on: ubuntu-latest
    needs: build                         # only runs if build succeeds

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USER }}/tasks-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"                 # fail the job if CRITICAL found

  # ────────────────────────────────────────────────────────────
  # STAGE 4 — Push image to Docker Hub
  # ────────────────────────────────────────────────────────────
  push:
    runs-on: ubuntu-latest
    needs: scan                          # only runs if scan passes

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker tag  $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

  # ────────────────────────────────────────────────────────────
  # STAGE 5 — Deploy to Render
  # ────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Trigger Render deployment
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
